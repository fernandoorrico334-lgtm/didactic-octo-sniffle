[project]
name = "polymarket-kalshi-arbitrage"
version = "0.1.0"
description = "FastAPI scanner for Polymarket/Kalshi prediction-market arbitrage signals."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "PyYAML>=6.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

